services:
  logmon-ollama:
    image: ollama/ollama:latest
    container_name: logmon-ollama
    volumes:
      - /home/ksh/logmon/data/ollama:/root/.ollama
    networks:
      - logmon-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
    restart: unless-stopped
    # 컨테이너 시작 시 모델을 미리 pull 하도록 설정 가능
    command: ollama serve

  logmon-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logmon-backend
    ports:
      - "3008:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - LOGMON_DB_DIR=/app/data
      - LOGMON_CHROMA_DIR=/app/chroma_data
      - OLLAMA_HOST=http://logmon-ollama:11434
      # ◀ 여기서 모델을 지정합니다. LLM 로직 코드에서 이 변수를 참조하도록 확인하세요!
      - LLM_MODEL=llama3.2:1b 
      - ALLOWED_API_KEYS=${ALLOWED_API_KEYS}
    volumes:
      - /home/ksh/logmon/backend:/app/backend
      - /home/ksh/logmon/data/db:/app/data
      - /home/ksh/logmon/data/chroma:/app/chroma_data
    networks:
      - logmon-network
    depends_on:
      - logmon-ollama
    deploy:
      resources:
        limits:
          cpus: "3.0"
    restart: unless-stopped

  logmon-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logmon-ui
    ports:
      - "3007:8501"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - BACKEND_URL=http://logmon-backend:8000
      - LOGMON_API_KEY=${ALLOWED_API_KEYS}
    networks:
      - logmon-network
    depends_on:
      - logmon-backend
    restart: unless-stopped

networks:
  logmon-network:
    name: logmon-network
    driver: bridge