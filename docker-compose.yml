services:
  logmon-ollama:
    image: ollama/ollama:latest
    container_name: logmon-ollama
    volumes:
      - /home/ksh/logmon/data/ollama:/root/.ollama
    networks:
      - logmon-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
    restart: unless-stopped

  logmon-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logmon-backend
    ports:
      - "3008:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - LOGMON_DB_DIR=/app/data
      - LOGMON_CHROMA_DIR=/app/chroma_data
      - OLLAMA_HOST=http://logmon-ollama:11434
      - LLM_MODEL=qwen2.5:3b 
      - ALLOWED_API_KEYS=${ALLOWED_API_KEYS}
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - /home/ksh/logmon/backend:/app/backend
      - /home/ksh/logmon/data/db:/app/data
      - /home/ksh/logmon/data/chroma:/app/chroma_data
    networks:
      - logmon-network
    depends_on:
      - logmon-ollama
    deploy:
      resources:
        limits:
          cpus: "3.0"
    restart: unless-stopped

  logmon-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logmon-ui
    ports:
      - "3007:8501"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - BACKEND_URL=http://logmon-backend:8000
      - LOGMON_API_KEY=${ALLOWED_API_KEYS}
    networks:
      - logmon-network
    depends_on:
      - logmon-backend
    restart: unless-stopped

networks:
  logmon-network:
    name: logmon-network
    driver: bridge