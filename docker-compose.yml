services:
  logmon-ollama:
    image: ollama/ollama:latest
    container_name: logmon-ollama
    volumes:
      - /home/ksh/logmon/data/ollama:/root/.ollama
    networks:
      - logmon-network
    deploy:
      resources:
        limits:
          cpus: "3.0"
    restart: unless-stopped

  logmon-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logmon-backend
    ports:
      - "3008:8000"
    env_file:
      - .env
    environment:
      - LOGMON_DB_DIR=/app/data
      - LOGMON_CHROMA_DIR=/app/chroma_data
      - OLLAMA_HOST=http://logmon-ollama:11434
      - ALLOWED_API_KEYS=${ALLOWED_API_KEYS}
    volumes:
      - /home/ksh/logmon/data/db:/app/data
      - /home/ksh/logmon/data/chroma:/app/chroma_data
    networks:
      - logmon-network
    depends_on:
      - logmon-ollama
    deploy:
      resources:
        limits:
          cpus: "3.0"
    restart: unless-stopped

  logmon-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logmon-ui
    ports:
      - "3007:8501"
    env_file:
      - .env  # <── [추가] 프론트엔드 컨테이너도 .env 파일을 읽도록 설정합니다.
    environment:
      - BACKEND_URL=http://logmon-backend:8000
      - ALLOWED_API_KEYS=${ALLOWED_API_KEYS}  # <── [추가] 프론트엔드가 백엔드 API를 호출할 때 헤더에 실어 보낼 키를 전달합니다.
    networks:
      - logmon-network
    depends_on:
      - logmon-backend
    restart: unless-stopped

networks:
  logmon-network:
    name: logmon-network
    driver: bridge